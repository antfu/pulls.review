<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diffs embed playground</title>
    <style>
      /*
       * Everything here is deliberately plain, hand-written CSS - this page stands in
       * for github.com's own page, which the real embed never gets to style. Nothing
       * here reaches the <pulls-review-embed-panel> shadow root either way.
       */
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        background: #f6f8fa;
        color: #1f2328;
      }
      body.dark-host {
        background: #0d1117;
        color: #e6edf3;
      }
      #toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        border-bottom: 1px solid #d0d7de;
      }
      #toolbar input {
        padding: 4px 8px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        font-size: 13px;
      }
      #toolbar button {
        padding: 5px 10px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        font-size: 13px;
      }
      #current-path {
        font-family: ui-monospace, monospace;
        font-size: 12px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <label>owner <input id="owner" value="antfu" /></label>
      <label>repo <input id="repo" value="eslint-config" /></label>
      <label>PR # <input id="number" value="861" /></label>
      <button id="load" type="button">Navigate</button>
      <button id="toggle-dark" type="button">Toggle host dark mode</button>
      <span id="current-path"></span>
    </div>

    <!--
      Stands in for the userscript's `@require`: point this at wherever `diffs-embed.js`
      is actually being served. `pnpm run build:embed` writes it to public/embed/,
      which `pnpm dev`'s main Vite server also serves verbatim at this same path - so
      running `pnpm run playground:embedded` after a build just works.
    -->
    <script src="/embed/diffs-embed.js"></script>
    <script>
      const ownerInput = document.getElementById('owner')
      const repoInput = document.getElementById('repo')
      const numberInput = document.getElementById('number')
      const currentPathEl = document.getElementById('current-path')

      // The component reads `location.pathname`/`document.documentElement.dataset.colorMode`
      // itself (see app/embed/EmbedApp.ce.vue) - exactly like the real userscript, this page
      // never passes it any attributes.
      let panelEl

      function mountPanel() {
        panelEl?.remove()
        panelEl = document.createElement('pulls-review-embed-panel')
        document.body.appendChild(panelEl)
      }

      function setHostColorMode(mode) {
        document.documentElement.dataset.colorMode = mode
        document.body.classList.toggle('dark-host', mode === 'dark')
      }

      function navigateTo(owner, repo, number) {
        const path = `/${owner}/${repo}/pull/${number}`
        history.pushState(null, '', path)
        currentPathEl.textContent = path
        // Turbo's own navigation event, which the component listens for to re-sync -
        // `pushState` alone doesn't fire anything observable.
        document.dispatchEvent(new Event('turbo:load'))
      }

      document.getElementById('load').addEventListener('click', () => {
        navigateTo(ownerInput.value.trim(), repoInput.value.trim(), numberInput.value.trim())
      })

      // Dark mode is seeded once, at mount, from the host attribute - matching real
      // usage (GitHub's theme doesn't change mid-session), toggling it here needs a
      // fresh element, not just re-syncing the existing one.
      document.getElementById('toggle-dark').addEventListener('click', () => {
        setHostColorMode(document.documentElement.dataset.colorMode === 'dark' ? 'light' : 'dark')
        mountPanel()
      })

      setHostColorMode('light')
      navigateTo(ownerInput.value, repoInput.value, numberInput.value)
      mountPanel()
    </script>
  </body>
</html>
