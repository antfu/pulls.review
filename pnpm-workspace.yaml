minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - '@pierre/theme@2.0.0'
  - why-is-node-running@3.2.2
  - '@vercel/detect-agent@1.2.5'

update:
  ignoreDeps:
    - typescript@7

autoInstallPeers: false
strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true

packages:
  - packages/*

overrides:
  # Force a single @unocss/core across the tree (e.g. @antfu/design's own nested
  # copy) - a duplicate at a different version is a structural TS type mismatch
  # in uno.config.ts's `presets` array, not just a wasted install.
  '@unocss/core': 'catalog:build'
  chokidar: 'catalog:build'
  rollup: 4.62.5
  semver: 'catalog:build'
  unplugin: 'catalog:build'
  vite: 'catalog:build'
  workbox-build: 7.4.0

allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false
  unrs-resolver: true
  vue-demi: true

catalogs:
  agentic:
    '@antfu/skills': ^0.1.0
    skills-npm: ^4.0.0
  build:
    '@unocss/core': ^66.10.5
    '@unocss/eslint-config': ^66.10.5
    '@unocss/reset': ^66.10.5
    '@vitejs/plugin-vue': ^6.0.9
    chokidar: ^5.0.0
    lightningcss: ^1.33.0
    semver: ^7.8.5
    tinyglobby: ^0.2.17
    tsdown: ^0.23.0
    unocss: ^66.10.5
    unplugin: ^3.4.0
    vite: ^8.3.2
  dev:
    '@antfu/eslint-config': ^9.5.1
    '@types/node': ^26.6.4
    '@types/picomatch': ^4.0.3
    bumpp: ^12.3.0
    eslint: ^10.12.0
    eslint-plugin-format: ^2.0.1
    eslint-plugin-slop: ^0.1.3
    eslint-plugin-sonarjs: ^4.2.2
    jiti: ^2.7.0
    typescript: ^6.0.3
    vue-tsc: ^3.3.12
  frontend:
    '@ai-sdk/gateway': ^4.0.103
    '@antfu/design': ^0.6.0
    '@antfu/utils': ^9.3.0
    '@comark/vue': ^0.7.0
    '@earendil-works/pi-agent-core': ^0.87.1
    '@earendil-works/pi-ai': ^0.87.1
    '@pierre/diffs': ^1.5.1
    '@shikijs/engine-javascript': ^4.5.0
    '@tanstack/vue-virtual': ^3.13.39
    '@valibot/to-json-schema': ^1.8.0
    '@vueuse/core': ^14.4.0
    animejs: ^4.5.0
    colorjs.io: ^0.7.1
    diff: ^9.0.0
    fzf: ^0.5.2
    idb-keyval: ^6.3.0
    lz-string-es: ^1.0.0
    nostics: ^1.3.0
    picomatch: ^4.0.7
    reka-ui: ^2.10.5
    unstorage: ^1.17.5
    valibot: ^1.5.0
    vue: ^3.5.43
    vue-afloat: ^0.2.0
    vue-i18n: ^11.4.13
    vue-router: ^4.6.4
    zod: ^4.6.5
  icons:
    '@iconify-json/carbon': ^1.2.28
    '@iconify-json/catppuccin': ^1.2.17
    '@iconify-json/octicon': ^1.2.37
    '@iconify-json/ph': ^1.2.2
    '@iconify-json/simple-icons': ^1.2.98
    '@iconify-json/twemoji': ^1.2.5
  storybook:
