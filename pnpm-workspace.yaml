minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - '@pierre/theme@2.0.0'
  - why-is-node-running@3.2.2

update:
  ignoreDeps:
    - typescript@7

autoInstallPeers: false
strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true
packages: []

overrides:
  # Force a single @unocss/core across the tree (e.g. @antfu/design's own nested
  # copy) - a duplicate at a different version is a structural TS type mismatch
  # in uno.config.ts's `presets` array, not just a wasted install.
  '@unocss/core': 'catalog:build'
  chokidar: 'catalog:build'
  rollup: 4.62.5
  semver: 'catalog:build'
  unplugin: 'catalog:build'
  vite: 'catalog:build'
  workbox-build: 7.4.0

allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false
  unrs-resolver: true
  vue-demi: true

catalog:
  '@shikijs/engine-javascript': ^4.4.3

catalogs:
  build:
    '@unocss/core': ^66.10.5
    '@unocss/eslint-config': ^66.10.5
    '@unocss/reset': ^66.10.5
    '@vitejs/plugin-vue': ^6.0.9
    chokidar: ^5.0.0
    lightningcss: ^1.33.0
    semver: ^7.8.5
    tinyglobby: ^0.2.17
    unocss: ^66.10.5
    unplugin: ^3.4.0
    vite: ^8.3.1
  dev:
    '@antfu/eslint-config': ^9.5.1
    '@types/node': ^26.6.3
    '@types/picomatch': ^4.0.3
    eslint: ^10.11.0
    eslint-plugin-format: ^2.0.1
    eslint-plugin-slop: ^0.1.3
    eslint-plugin-sonarjs: ^4.2.1
    jiti: ^2.7.0
    typescript: ^6.0.3
    vue-tsc: ^3.3.11
  frontend:
    '@ai-sdk/anthropic': ^4.0.65
    '@ai-sdk/gateway': ^4.0.96
    '@ai-sdk/openai-compatible': ^3.0.57
    '@antfu/design': ^0.5.3
    '@antfu/utils': ^9.3.0
    '@comark/vue': ^0.7.0
    '@earendil-works/pi-agent-core': ^0.87.1
    '@earendil-works/pi-ai': ^0.87.1
    '@pierre/diffs': ^1.5.1
    '@tanstack/vue-virtual': ^3.13.39
    '@valibot/to-json-schema': ^1.8.0
    '@vueuse/core': ^14.4.0
    ai: ^7.0.118
    animejs: ^4.5.0
    colorjs.io: ^0.7.1
    idb-keyval: ^6.3.0
    lz-string: ^1.5.0
    picomatch: ^4.0.7
    reka-ui: ^2.10.5
    unstorage: ^1.17.5
    valibot: ^1.5.0
    vue: ^3.5.43
    vue-afloat: ^0.1.1
    vue-router: ^4.6.4
  icons:
    '@iconify-json/carbon': ^1.2.28
    '@iconify-json/catppuccin': ^1.2.17
    '@iconify-json/ph': ^1.2.2
    '@iconify-json/twemoji': ^1.2.5
  storybook:
    '@storybook/vue3-vite': ^10.6.0
    storybook: ^10.6.0
  testing:
    '@vue/test-utils': ^2.5.1
    fake-indexeddb: ^6.2.5
    happy-dom: ^20.14.5
    vitest: ^5.0.2
